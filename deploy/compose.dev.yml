name: guanlan-v2-dev
x-backend: &backend
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  environment: &environment
    OBS_DATABASE_URL: postgresql+psycopg://guanlan:${OBS_DB_PASSWORD:?Set OBS_DB_PASSWORD}@postgres:5432/guanlan_v2
    OBS_ADMIN_TOKEN: ${OBS_ADMIN_TOKEN:?Set OBS_ADMIN_TOKEN}
    OBS_ENGINE_URL: http://changedetection:5000
    OBS_ENGINE_KEY: ${OBS_ENGINE_KEY:?Set a dedicated OBS_ENGINE_KEY}
    OBS_FILES_ROOT: /srv/guanlan/data-v2
  volumes:
    - files:/srv/guanlan/data-v2
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: guanlan_v2
      POSTGRES_USER: guanlan
      POSTGRES_PASSWORD: ${OBS_DB_PASSWORD:?Set OBS_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:55432:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -U guanlan -d guanlan_v2]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *backend
    command: [python, -m, backend.cli, migrate]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *backend
    command: [uvicorn, backend.api:create_app, --factory, --host, 0.0.0.0, --port, "8842", --no-access-log]
    ports:
      - 127.0.0.1:8842:8842
    depends_on:
      migrate:
        condition: service_completed_successfully
  scheduler:
    <<: *backend
    command: [python, -m, backend.cli, scheduler]
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    <<: *backend
    command: [python, -m, backend.cli, worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
      changedetection:
        condition: service_started
  changedetection:
    image: dgtlmoon/changedetection.io:0.70.4
    entrypoint: [python, /bootstrap/engine_bootstrap.py]
    environment:
      OBS_ENGINE_DATA: /datastore
      OBS_ENGINE_HOST: 0.0.0.0
      OBS_ENGINE_PORT: "5000"
      OBS_ENGINE_KEY: ${OBS_ENGINE_KEY:?Set a dedicated OBS_ENGINE_KEY}
      FETCH_WORKERS: "3"
      LOGGER_LEVEL: WARNING
    volumes:
      - engine-data:/datastore
      - ../backend/engine_bootstrap.py:/bootstrap/engine_bootstrap.py:ro
    restart: unless-stopped
volumes:
  pgdata:
  files:
  engine-data:
